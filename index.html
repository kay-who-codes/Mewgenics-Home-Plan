<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 Mewgenics Home Plan</title>
<style>
  :root {
    --bg: #14141a;
    --panel: #1c1c24;
    --roof: #7f77dd;
    --roof-hover: #9a93e8;
    --left: #1d9e75;
    --left-hover: #26c491;
    --right: #d85a30;
    --right-hover: #ef7346;
    --wall-line: #34343f;
    --text: #ececf2;
    --text-dim: #9a9aa8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }
  header { text-align: center; margin-bottom: 2rem; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; letter-spacing: 0.5px; }
  p.sub { color: var(--text-dim); font-size: 14px; margin: 0; }

  .house-wrap {
    width: 100%;
    max-width: 480px;
  }
  svg { width: 100%; height: auto; display: block; overflow: visible; }

  .shape {
    cursor: pointer;
    transition: fill 0.15s ease, transform 0.15s ease;
    transform-origin: center;
  }
  .shape:hover { transform: scale(1.015); }
  .roof { fill: var(--roof); }
  .roof:hover { fill: var(--roof-hover); }
  .left-room { fill: var(--left); }
  .left-room:hover { fill: var(--left-hover); }
  .right-room { fill: var(--right); }
  .right-room:hover { fill: var(--right-hover); }

  .label {
    font-size: 20px;
    font-weight: 500;
    fill: #fff;
    pointer-events: none;
    text-anchor: middle;
  }
  .label.small { font-size: 16px; }

  .panel {
    margin-top: 2rem;
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 0.5px solid var(--wall-line);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    min-height: 90px;
    display: none;
  }
  .panel.active { display: block; }
  .panel h2 { font-size: 16px; font-weight: 500; margin: 0 0 6px; }
  .panel p { font-size: 14px; line-height: 1.6; color: var(--text-dim); margin: 0; }

  .tag {
    display: inline-block;
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .tag.roof-tag { background: #3c3489; color: #cecbf6; }
  .tag.left-tag { background: #0f6e56; color: #9fe1cb; }
  .tag.right-tag { background: #993c1d; color: #f0997b; }
</style>
</head>
<body>

<header>
  <h1>Mewgenics Home Plan</h1>
  <p class="sub">Tap a room to see what happens there</p>
</header>

<div class="house-wrap">
  <svg viewBox="0 0 400 320" role="img" aria-label="A house with three clickable areas: roof for breeding, left room for waiting, right room for Mewgenics">
    <polygon class="shape roof" points="20,150 200,30 380,150" data-room="breeding" />
    <rect class="shape left-room" x="20" y="150" width="180" height="150" data-room="waiting" />
    <rect class="shape right-room" x="200" y="150" width="180" height="150" data-room="mewgenics" />
    <text class="label" x="200" y="115">Elite Breeding</text>
    <text class="label small" x="110" y="235">Decent Cats</text>
    <text class="label small" x="290" y="235">Eugenics</text>
  </svg>
</div>

<div class="panel" id="panel">
  <span class="tag" id="panel-tag"></span>
  <h2 id="panel-title"></h2>
  <p id="panel-desc"></p>
</div>

<script>
  const rooms = {
    breeding: {
      tag: "roof",
      tagClass: "roof-tag",
      title: "Elite Breeding",
      desc: "Fill this space with the best cats to ensure they pass down their genes."
    },
    waiting: {
      tag: "left room",
      tagClass: "left-tag",
      title: "Decent Cats",
      desc: "Cats resting here between runs, waiting their turn."
    },
    mewgenics: {
      tag: "right room",
      tagClass: "right-tag",
      title: "Eugenics",
      desc: "This room is for good inbred cats to breed with good eugenic cats."
    }
  };

  const shapes = document.querySelectorAll(".shape");
  const panel = document.getElementById("panel");
  const panelTag = document.getElementById("panel-tag");
  const panelTitle = document.getElementById("panel-title");
  const panelDesc = document.getElementById("panel-desc");

  shapes.forEach(shape => {
    shape.addEventListener("click", () => {
      const room = rooms[shape.dataset.room];
      panelTag.textContent = room.tag;
      panelTag.className = "tag " + room.tagClass;
      panelTitle.textContent = room.title;
      panelDesc.textContent = room.desc;
      panel.classList.add("active");
    });
  });
</script>

</body>
</html>
